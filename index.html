<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미팅메이트">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="미팅메이트 — 구글 실시간 번역으로 비즈니스 미팅을 실시간 자막·자동 녹음·요약하고, 주요 표현을 스터디로 모아 주는 미팅 코파일럿">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>미팅메이트 · 실시간 번역 미팅 코파일럿</title>
<style>
/* ─────────────────────────────────────────────────────────────
   미팅메이트 — professional dark slate + indigo / emerald
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#070B14;
  --bg-soft:#0B1220;
  --panel:#101A2B;
  --panel-2:#152134;
  --panel-3:#1A2740;
  --line:#22314C;
  --line-soft:#1A2539;
  --txt:#E9EEF9;
  --txt-2:#C3CEE2;
  --muted:#8FA0BC;
  --dim:#6B7C99;
  --indigo:#6366F1;
  --indigo-2:#8B8CF9;
  --indigo-dim:#312E81;
  --emerald:#10B981;
  --emerald-2:#34D399;
  --amber:#F59E0B;
  --rose:#F43F5E;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 18px 40px -22px rgba(0,0,0,.85);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:"Liberation Sans","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"Liberation Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(99,102,241,.20), transparent 62%),
    radial-gradient(900px 480px at 94% -4%, rgba(16,185,129,.13), transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;font-size:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--indigo-2)}
::selection{background:rgba(99,102,241,.4)}
:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px}

/* ── shell ─────────────────────────────────────────────── */
.app{max-width:940px;margin:0 auto;padding:0 16px calc(84px + var(--safe-b));min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 2px 10px;
  background:linear-gradient(180deg, rgba(7,11,20,.94) 62%, rgba(7,11,20,0));
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#6366F1,#10B981);
  box-shadow:0 8px 22px -10px rgba(99,102,241,.95), inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-mark svg{width:21px;height:21px}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand-sub{font-size:9.5px;letter-spacing:.15em;color:var(--dim);font-weight:600}
.topbar-side{display:flex;align-items:center;gap:9px}
.top-pill{
  font-size:11px;font-weight:700;color:var(--emerald-2);
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);
  padding:5px 10px;border-radius:999px;white-space:nowrap;
}
.top-pill.is-gpt{color:#C7B4FF;background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.35)}
.icon-btn{
  width:40px;height:40px;display:grid;place-items:center;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--txt-2);
  cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.content{padding-top:6px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:4px;
  padding:8px 12px calc(8px + var(--safe-b));
  background:linear-gradient(180deg, rgba(7,11,20,.55), rgba(7,11,20,.97) 42%);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(34,49,76,.7);
}
.tabbar button{
  flex:1 1 0;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px 6px;border:0;border-radius:14px;background:transparent;
  color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;
}
.tabbar .ico{width:24px;height:24px;display:grid;place-items:center}
.tabbar .ico svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--txt);background:rgba(99,102,241,.14)}
.tabbar button[aria-current="page"] .ico{color:var(--indigo-2)}

/* ── generic ───────────────────────────────────────────── */
.card{
  background:linear-gradient(180deg, rgba(21,33,52,.92), rgba(16,26,43,.94));
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.center{text-align:center}
.grow{flex:1;min-width:0}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:11px 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--txt);font-weight:700;font-size:14px;
  cursor:pointer;transition:transform .12s, background .15s, border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.primary{
  background:linear-gradient(135deg,#6366F1,#4F46E5);border-color:transparent;color:#fff;
  box-shadow:0 12px 30px -14px rgba(99,102,241,1);
}
.btn.primary:hover{background:linear-gradient(135deg,#7275F5,#5B52F0)}
.btn.start{
  min-height:60px;font-size:17px;border-radius:18px;letter-spacing:-.01em;
  background:linear-gradient(135deg,#10B981,#059669);color:#04120C;
  box-shadow:0 16px 34px -16px rgba(16,185,129,.95);
  border:0;
}
.btn.start:hover{background:linear-gradient(135deg,#24C892,#0AA173)}
.btn.stop{background:linear-gradient(135deg,#F43F5E,#BE123C);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.soft{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.35);color:#C9CAFF}
.btn.sm{min-height:36px;padding:7px 12px;font-size:12.5px;border-radius:11px;gap:6px}
.btn.sm svg{width:15px;height:15px}
.btn.wide{width:100%}
.btn.icon-only{width:42px;min-height:42px;padding:0}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--muted);
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:#33476a;color:var(--txt-2)}
.chip[aria-pressed="true"],.chip.on{
  background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.55);color:#D6D7FF;
}
.chip.em.on{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.5);color:#A7F3D0}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;
  font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
}
.tag.en{background:rgba(99,102,241,.16);color:#B9BAFF;border:1px solid rgba(99,102,241,.32)}
.tag.ko{background:rgba(16,185,129,.14);color:#8DEBC8;border:1px solid rgba(16,185,129,.3)}
.tag.demo{background:rgba(245,158,11,.14);color:#FCD34D;border:1px solid rgba(245,158,11,.32)}
.tag.gpt{background:rgba(139,92,246,.16);color:#D6C4FF;border:1px solid rgba(139,92,246,.35)}
.tag.gray{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}

.section-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.section-title::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
.divider{height:1px;background:var(--line-soft);margin:14px 0}

input[type=text],input[type=password],input[type=search],textarea,select{
  width:100%;background:#0C1524;border:1px solid var(--line);border-radius:12px;
  color:var(--txt);padding:11px 13px;font-family:inherit;font-size:14px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
label.field{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--dim)}
.search-wrap input{padding-left:38px}

/* ── live: idle hero ───────────────────────────────────── */
.hero{padding:22px;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:auto -70px -110px auto;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(99,102,241,.28), transparent 68%);pointer-events:none;
}
.hero-kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--emerald-2);text-transform:uppercase}
.hero-kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 4px rgba(16,185,129,.16)}
.hero h1{font-size:26px;line-height:1.28;margin:10px 0 6px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,#A5B4FC,#6EE7B7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:13.5px;max-width:46ch}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hero-actions .btn.start{flex:1 1 220px}
.dir-row{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin-top:16px}
.dir-card{
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.025);
  display:flex;flex-direction:column;gap:2px;
}
.dir-card b{font-size:13.5px}
.dir-card span{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.dir-card.other{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.09)}
.dir-card.me{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.07)}
.dir-arrow{color:var(--dim);display:grid;place-items:center}
.dir-arrow svg{width:20px;height:20px}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feature{border:1px solid var(--line-soft);border-radius:15px;padding:13px;background:rgba(255,255,255,.02)}
.feature .fi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(99,102,241,.14);color:#C7C8FF;margin-bottom:8px}
.feature .fi svg{width:17px;height:17px}
.feature b{display:block;font-size:12.5px;margin-bottom:2px}
.feature span{font-size:11px;color:var(--dim);line-height:1.45;display:block}

.guide-card{padding:15px 16px}
.guide-card h3{font-size:13.5px;display:flex;align-items:center;gap:7px}
.guide-card ol{margin:8px 0 0;padding-left:19px;color:var(--muted);font-size:12.5px;line-height:1.65}
.guide-card .note{margin-top:9px;font-size:11.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:9px}
.guide-card.warn{border-color:rgba(245,158,11,.32);background:rgba(245,158,11,.05)}

/* ── live: session ─────────────────────────────────────── */
.session{padding:14px;z-index:20;background:linear-gradient(180deg,rgba(16,26,43,.98),rgba(16,26,43,.94))}
.session-top{display:flex;align-items:center;gap:10px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 4px rgba(244,63,94,.15);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.timer{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.02em;line-height:1}
.timer.paused{color:var(--amber)}
.session-meta{display:flex;flex-direction:column;gap:1px}
.session-meta .s1{font-size:12px;font-weight:700;color:var(--txt-2)}
.session-meta .s2{font-size:10.5px;color:var(--dim)}
.level{display:flex;align-items:center;gap:2.5px;height:26px;margin-left:auto}
.level i{width:3px;border-radius:2px;background:var(--emerald);height:5px;transition:height .08s linear;opacity:.9}
.level.idle i{background:var(--dim);height:4px}
.meter-note{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}

.speaker-switch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.spk{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;text-align:left;transition:.15s;
}
.spk .av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em;flex:0 0 34px}
.spk .sp1{font-size:12.5px;font-weight:800;line-height:1.25}
.spk .sp2{font-size:10.5px;color:var(--dim);line-height:1.3}
.spk[data-spk="other"] .av{background:rgba(99,102,241,.18);color:#B9BAFF}
.spk[data-spk="me"] .av{background:rgba(16,185,129,.16);color:#8DEBC8}
.spk[aria-pressed="true"][data-spk="other"]{border-color:var(--indigo);background:rgba(99,102,241,.16);box-shadow:0 0 0 1px rgba(99,102,241,.5), 0 10px 24px -18px #6366F1}
.spk[aria-pressed="true"][data-spk="me"]{border-color:var(--emerald);background:rgba(16,185,129,.14);box-shadow:0 0 0 1px rgba(16,185,129,.5), 0 10px 24px -18px #10B981}
.spk .live-bars{margin-left:auto;display:none;gap:2px;align-items:flex-end;height:14px}
.spk[aria-pressed="true"] .live-bars{display:flex}
.spk .live-bars i{width:2.5px;background:currentColor;border-radius:2px;animation:bars .9s infinite ease-in-out}
.spk .live-bars i:nth-child(2){animation-delay:.15s}
.spk .live-bars i:nth-child(3){animation-delay:.3s}
@keyframes bars{0%,100%{height:4px}50%{height:12px}}

.caption-tools{display:flex;align-items:center;gap:7px;margin:13px 2px 8px;flex-wrap:wrap}
.caption-tools .spacer{flex:1}
.captions{
  display:flex;flex-direction:column;gap:9px;
  max-height:52dvh;min-height:180px;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 2px 10px;
}
.captions:empty::before{
  content:"미팅을 시작하면 여기에 실시간 자막이 쌓입니다. 상대(English)와 나(한국어)를 탭으로 바꿔 가며 말하세요.";
  display:block;padding:34px 16px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7;
  border:1px dashed var(--line);border-radius:14px;
}
.cap{
  position:relative;border:1px solid var(--line-soft);border-radius:14px;
  background:rgba(255,255,255,.022);padding:10px 12px 11px 13px;
  border-left:3px solid var(--indigo);
  animation:capIn .22s ease-out;
}
@keyframes capIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cap.me{border-left-color:var(--emerald)}
.cap.star{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.045)}
.cap-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.cap-time{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.cap-src{font-size:15.5px;line-height:1.5;color:#F3F6FC;word-break:break-word}
.cap.me .cap-src{color:#EAFBF4}
.cap-dst{display:flex;gap:6px;margin-top:4px;font-size:13.5px;line-height:1.5;color:#B9C4DA;word-break:break-word}
.cap-dst::before{content:"→";color:var(--dim);flex:0 0 auto}
.cap-dst.pending{color:var(--dim);font-style:italic}
.cap-dst.fail{color:#FCA5A5}
.cap-actions{margin-left:auto;display:flex;gap:2px;align-items:center}
.mini-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:.13s;
}
.mini-btn:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.mini-btn svg{width:16px;height:16px}
.mini-btn.star-on{color:var(--amber)}
.mini-btn.star-on svg{fill:rgba(245,158,11,.9);stroke:var(--amber)}
.interim{
  border:1px dashed rgba(99,102,241,.45);border-radius:13px;padding:9px 12px;
  color:#A9B6D6;font-size:14px;display:flex;gap:8px;align-items:baseline;
}
.interim .who{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--indigo-2);text-transform:uppercase;flex:0 0 auto}
.interim.me{border-color:rgba(16,185,129,.4)}
.interim.me .who{color:var(--emerald-2)}
.interim .dots::after{content:"";animation:dots 1.2s infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}

.session-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.session-actions .btn{min-height:44px}
.rec-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:rgba(255,255,255,.025);font-size:12px;font-weight:700;cursor:pointer;min-height:42px}
.rec-toggle .sw{width:34px;height:19px;border-radius:999px;background:#2A3A57;position:relative;transition:.18s;flex:0 0 34px}
.rec-toggle .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#94A3B8;transition:.18s}
.rec-toggle[aria-pressed="true"] .sw{background:rgba(244,63,94,.85)}
.rec-toggle[aria-pressed="true"] .sw::after{left:17.5px;background:#fff}
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:13px;
  font-size:12.5px;line-height:1.55;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt-2);
}
.banner .bi{flex:0 0 auto;margin-top:1px}
.banner b{color:var(--txt)}
.banner.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07)}
.banner.err{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.08)}
.banner.ok{border-color:rgba(16,185,129,.32);background:rgba(16,185,129,.07)}
.banner.info{border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.08)}
.banner .btn{margin-left:auto;flex:0 0 auto}

/* ── summaries ─────────────────────────────────────────── */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.page-head .btn{flex:0 0 auto;white-space:nowrap}
.study-tools .btn{white-space:nowrap;flex:0 0 auto}
.study-tools .search-wrap{flex:1 1 220px;min-width:150px}
.page-head h1{font-size:22px;letter-spacing:-.02em}
.page-head p{font-size:12.5px;color:var(--dim);margin-top:3px}
.meeting-card{display:flex;gap:13px;padding:15px;cursor:pointer;transition:.15s}
.meeting-card:hover{border-color:#31456A;transform:translateY(-1px)}
.mc-date{
  flex:0 0 54px;text-align:center;border-radius:12px;padding:7px 4px;
  background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);
}
.mc-date b{display:block;font-size:18px;line-height:1.15;color:#C7C8FF}
.mc-date span{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.06em;font-weight:700}
.mc-body{min-width:0;flex:1}
.mc-body h3{font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px;font-size:11px;color:var(--dim)}
.mc-one{margin-top:6px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{
  padding:38px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--dim);
}
.empty .eico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin:0 auto 10px;background:rgba(99,102,241,.1);color:#A5B4FC}
.empty .eico svg{width:24px;height:24px}
.empty b{display:block;color:var(--txt-2);font-size:14px;margin-bottom:4px}
.empty p{font-size:12.5px;line-height:1.6}

.detail-head{padding:16px}
.detail-head h1{font-size:19px;line-height:1.35;margin-bottom:6px}
.detail-head .dm{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--dim)}
.audio-box{margin-top:13px;border:1px solid var(--line);border-radius:14px;padding:11px;background:rgba(0,0,0,.22)}
.audio-box .abt{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.audio-box .abt svg{width:15px;height:15px;flex:0 0 15px}
.player{display:flex;align-items:center;gap:11px;padding:4px 2px 2px}
.pbtn{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#6366F1,#10B981);
  box-shadow:0 10px 22px -12px rgba(99,102,241,.9);
}
.pbtn svg{width:19px;height:19px}
.pbar{position:relative;flex:1;height:6px;border-radius:99px;background:#22314C;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#6366F1,#10B981);transition:width .1s linear}
.pbar input{position:absolute;left:-4px;right:-4px;top:-9px;bottom:-9px;width:calc(100% + 8px);opacity:0;cursor:pointer;margin:0}
.ptime{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto}
.summary-block{padding:16px}
.summary-block h2{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.summary-block h2 svg{width:15px;height:15px;flex:0 0 15px;color:var(--indigo-2)}
.banner svg{width:18px;height:18px;flex:0 0 18px}
.feature .fi svg{width:17px;height:17px}
.empty .eico svg{width:24px;height:24px}
.guide-card h3 svg{width:16px;height:16px;flex:0 0 16px}
.row.tiny svg{width:13px;height:13px;vertical-align:-2px}
.oneliner{
  font-size:16px;line-height:1.55;font-weight:700;letter-spacing:-.01em;
  border-left:3px solid var(--emerald);padding-left:12px;color:#F2F7FF;
}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li{position:relative;padding-left:17px;font-size:13.5px;line-height:1.55;color:var(--txt-2)}
ul.clean li::before{content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--indigo)}
ul.clean.em li::before{background:var(--emerald)}
.action-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.action-item:last-child{border-bottom:0}
.action-check{width:18px;height:18px;border-radius:6px;border:1.5px solid #33456A;flex:0 0 18px;margin-top:2px;cursor:pointer;display:grid;place-items:center;color:transparent;background:transparent}
.action-check.on{background:var(--emerald);border-color:var(--emerald);color:#04120C}
.action-check svg{width:12px;height:12px}
.action-body{flex:1;min-width:0}
.action-body b{font-size:13.5px;font-weight:700;display:block;line-height:1.45}
.action-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.action-meta span{font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.04);padding:2px 7px;border-radius:6px}
.expr-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.expr-row:last-child{border-bottom:0}
.expr-body{flex:1;min-width:0}
.expr-en{font-size:14.5px;font-weight:700;line-height:1.4;color:#EEF3FF;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.expr-ko{font-size:12.5px;color:#A7B6CE;margin-top:2px}
.expr-nu{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.expr-alt{font-size:11.5px;color:#8FA0BC;margin-top:3px}
.expr-alt b{color:var(--emerald-2);font-weight:700}
.transcript{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px solid rgba(34,49,76,.45)}
.trow .tt{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 38px;padding-top:2px}
.trow .ts{flex:1;color:var(--txt-2)}
.trow .ts small{display:block;color:var(--dim);font-size:11.5px}
.summary-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skeleton{height:13px;border-radius:6px;background:linear-gradient(90deg,#16223a,#20304c,#16223a);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── study ─────────────────────────────────────────────── */
.study-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.025)}
.stat b{display:block;font-size:20px;line-height:1.15;letter-spacing:-.02em}
.stat span{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.stat.i b{color:#C7C8FF}.stat.e b{color:#8DEBC8}.stat.a b{color:#FCD34D}
.study-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.study-list{display:flex;flex-direction:column;gap:9px}
.sitem{border:1px solid var(--line-soft);border-radius:15px;padding:13px;background:rgba(255,255,255,.02);transition:.15s}
.sitem:hover{border-color:#2C3F60}
.sitem.done{opacity:.72}
.sitem.done .sen{text-decoration:line-through;text-decoration-color:rgba(16,185,129,.7);text-decoration-thickness:2px}
.sitem-top{display:flex;align-items:flex-start;gap:9px}
.sitem .sen{font-size:15px;font-weight:700;line-height:1.45;color:#F0F5FF;word-break:break-word}
.sitem .sko{font-size:12.5px;color:#A7B6CE;margin-top:3px;line-height:1.5}
.sitem .snu{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.sitem-bottom{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.src-badge{font-size:10px;color:var(--dim);background:rgba(255,255,255,.04);padding:3px 7px;border-radius:6px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .grow{flex:1}
.learn-btn{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;
}
.learn-btn.on{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.45);color:#8DEBC8}

/* review overlay */
.review-wrap{position:fixed;inset:0;z-index:60;background:rgba(4,7,13,.92);backdrop-filter:blur(8px);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + var(--safe-b))}
.review-head{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto 12px}
.review-head .rt{font-size:13px;font-weight:800}
.review-progress{height:5px;border-radius:99px;background:#1B2942;overflow:hidden;max-width:560px;width:100%;margin:0 auto 16px}
.review-progress i{display:block;height:100%;background:linear-gradient(90deg,#6366F1,#10B981);transition:width .25s}
.flash{
  flex:0 0 auto;max-width:560px;width:100%;margin:0 auto;min-height:290px;
  border-radius:24px;border:1px solid var(--line);padding:26px 22px;
  background:linear-gradient(160deg,#152135,#0F1928);box-shadow:0 30px 60px -30px #000;
  display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;
  transition:transform .18s;
}
.flash.flipped{transform:rotateX(0)}
.flash .f-tag{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.flash .f-en{font-size:22px;font-weight:800;line-height:1.35;letter-spacing:-.02em;color:#F5F8FF}
.flash .f-ko{font-size:15px;color:#B7C3D9;margin-top:10px;line-height:1.5}
.flash .f-nu{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.6;border-top:1px solid var(--line-soft);padding-top:12px}
.flash .f-hint{font-size:11px;color:var(--dim);margin-top:18px}
.review-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;width:100%;margin:18px auto 0}
.review-btns .btn{min-height:54px}
.review-foot{max-width:560px;width:100%;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kbd{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-family:var(--mono)}

/* ── sheet / modal ─────────────────────────────────────── */
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(3,6,12,.68);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;
  background:linear-gradient(180deg,#111B2C,#0C1523);
  border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;padding:18px 18px calc(22px + var(--safe-b));
  animation:sheetUp .24s cubic-bezier(.2,.9,.25,1);
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:17px;flex:1;letter-spacing:-.02em}
.sheet-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.set-group{border:1px solid var(--line-soft);border-radius:15px;padding:14px;background:rgba(255,255,255,.018)}
.set-group h3{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.set-row + .set-row{border-top:1px solid rgba(34,49,76,.5)}
.set-row .lbl{font-size:13px;font-weight:700}
.set-row .sub{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.45}
.switch{width:46px;height:26px;border-radius:99px;background:#26354F;border:0;position:relative;cursor:pointer;flex:0 0 46px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#94A3B8;transition:.18s}
.switch[aria-pressed="true"]{background:var(--indigo)}
.switch[aria-pressed="true"]::after{left:23px;background:#fff}
.hint{font-size:11px;color:var(--dim);line-height:1.55}
.key-note{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:#FCD34D;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);border-radius:11px;padding:9px 11px;line-height:1.5}
.danger-zone{border-color:rgba(244,63,94,.32);background:rgba(244,63,94,.05)}

/* ── toast ─────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  z-index:90;background:#1E2B45;border:1px solid #33456A;color:#EEF3FF;
  padding:10px 16px;border-radius:12px;font-size:12.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:0 16px 34px -18px #000;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── desktop / tablet ──────────────────────────────────── */
@media (min-width:820px){
  body{font-size:15.5px}
  .feature-grid{gap:12px}
  .session-actions{grid-template-columns:auto auto 1fr auto}
  .captions{max-height:50dvh}
  .summary-actions{grid-template-columns:repeat(4,1fr)}
  .hero h1{font-size:30px}
  .sheet{border-radius:24px;border-bottom:1px solid var(--line);margin:auto;max-height:88dvh;padding-bottom:22px}
  .sheet-back{align-items:center;padding:24px}
}
@media (max-width:560px){
  .study-tools .search-wrap{flex:1 1 100%}
  .study-tools .btn.primary{margin-left:auto}
}
@media (max-width:380px){
  .brand-sub{display:none}
  .feature-grid{grid-template-columns:1fr}
  .hero h1{font-size:23px}
  .study-stats{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat b{font-size:18px}
  .study-tools .search-wrap{flex:1 1 100%}
  .dir-row{grid-template-columns:1fr;gap:6px}
  .dir-arrow{transform:rotate(90deg)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>

    </button>

      요약
    </button>
    <button data-act="tab" data-tab="study">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a3 3 0 0 1 2 5.2V20a3 3 0 0 0-2-1H5.5A1.5 1.5 0 0 1 4 17.5v-12z"></path><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a3 3 0 0 0-2 5.2V20a3 3 0 0 1 2-1h4.5a1.5 1.5 0 0 0 1.5-1.5v-12z"></path></svg></span>

</div>

<div id="sheetRoot" hidden></div>

    if (exact.length) {
      var prefer = exact.filter(function (v) { return /google|samantha|aria|daniel|yuna|heami/i.test(v.name); });
      return prefer[0] || exact[0];
    }
    var base = lang.slice(0, 2);
    var near = voices.filter(function (v) { return v.lang && v.lang.slice(0, 2).toLowerCase() === base; });

  }
  function speak(text, lang, rate) {

  /* ═══════════════════════════════════════════════════════════
     오디오 캡처 · 녹음
     ═══════════════════════════════════════════════════════════ */
  function audioCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    return AC ? new AC() : null;
  }

  function setupAudio(opts) {
    opts = opts || {};
    var result = { ctx: null, dest: null, analyser: null, mic: null, display: null, gain: null, error: '' };
    var ctx = audioCtx();
    if (!ctx) { result.error = '이 브라우저는 오디오 녹음을 지원하지 않습니다.'; return Promise.resolve(result); }
    result.ctx = ctx;
    var dest = ctx.createMediaStreamDestination();
    var gain = ctx.createGain();
    gain.gain.value = 1;
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.7;
    gain.connect(dest);
    var finish = function () {
      if (ctx.state === 'suspended') ctx.resume().catch(function () {});
      rt.audio = result;
      result.dest = dest;
      result.gain = gain;
      result.analyser = analyser;
      return result;
    };

    if (opts.demo) {
      var osc = ctx.createOscillator();
      var og = ctx.createGain();
      og.gain.value = 0.035;
      osc.type = 'sine';
      osc.frequency.value = 196;
      var lfo = ctx.createOscillator();
      var lg = ctx.createGain();
      lfo.frequency.value = 0.22;
      lg.gain.value = 0.03;
      lfo.connect(lg);
      lg.connect(og.gain);
      osc.connect(og);
      og.connect(gain);
      // level meter를 위한 analyser 연결
      og.connect(analyser);
      osc.start();
      lfo.start();
      result.demoNodes = [osc, lfo];
      return Promise.resolve(finish());
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      result.error = '마이크를 사용할 수 없는 환경입니다(HTTPS 필요).';
      return Promise.resolve(finish());
    }
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    }).then(function (stream) {
      result.mic = stream;
      var src = ctx.createMediaStreamSource(stream);
      src.connect(gain);
      src.connect(analyser);
      return finish();
    }).catch(function (err) {
      result.error = (err && err.name === 'NotAllowedError')
        ? '마이크 권한이 거부되었습니다. 브라우저 설정에서 마이크를 허용해 주세요.'
        : '마이크를 열지 못했습니다' + (err && err.message ? ': ' + err.message : '');
      return finish();
    });
  }

  function teardownAudio() {
    if (!rt.audio) return;
    var a = rt.audio;
    try { (a.demoNodes || []).forEach(function (n) { try { n.stop(); } catch (e) {} }); } catch (e) {}
    try { if (a.mic) a.mic.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (a.display) a.display.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (a.ctx && a.ctx.state !== 'closed') a.ctx.close(); } catch (e) {}
    rt.audio = null;
  }

  function pickMime() {
    if (!window.MediaRecorder) return '';
    var candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < candidates.length; i++) {
      try { if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i]; } catch (e) {}
    }
    return '';
  }

  function startRecording() {
    if (!rt.audio || !rt.audio.dest || !window.MediaRecorder) return false;
    var mime = pickMime();
    var stream = rt.audio.dest.stream;
    try {
      var rec = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 64000 })
                     : new MediaRecorder(stream);
      rec.ondataavailable = function (e) {
        if (e.data && e.data.size > 0) rt.rec.chunks.push(e.data);
      };
      rec.onerror = function () {
        toast('녹음 중 오류가 발생했습니다.');
      };
      rec.start(1000);
      rt.rec.recorder = rec;
      rt.rec.on = true;
      rt.rec.mime = mime || (rec.mimeType || 'audio/webm');
      rt.rec.startedAt = Date.now();
      rt.rec.lengthMs = 0;
      updateRecUI();
      return true;
    } catch (e) {
      toast('녹음을 시작하지 못했습니다.');
      return false;
    }
  }

  function stopRecording() {
    return new Promise(function (resolve) {
      var rec = rt.rec.recorder;
      if (!rec) { resolve(null); return; }
      rt.rec.recorder = null;
      var chunks = rt.rec.chunks;
      var mime = rt.rec.mime || rec.mimeType || 'audio/webm';
      rt.rec.lengthMs = rt.rec.startedAt ? (Date.now() - rt.rec.startedAt) : 0;
      rec.onstop = function () {
        rt.rec.chunks = [];
        rt.rec.on = false;
        var blob = new Blob(chunks, { type: mime.split(';')[0] });
        resolve(blob.size > 400 ? { blob: blob, mime: mime, durationMs: rt.rec.lengthMs } : null);
      };
      try { rec.stop(); } catch (e) { rt.rec.on = false; resolve(null); }
    });
  }

  function pauseRecording() {
    if (rt.rec.recorder && rt.rec.recorder.state === 'recording') {
      try { rt.rec.recorder.pause(); } catch (e) {}
    }
  }
  function resumeRecording() {
    if (rt.rec.recorder && rt.rec.recorder.state === 'paused') {
      try { rt.rec.recorder.resume(); } catch (e) {}
    }
  }

  function addSystemAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      toast('이 브라우저는 시스템 오디오 공유를 지원하지 않습니다.');
      return Promise.resolve(false);
    }
    if (!rt.audio || !rt.audio.gain) { toast('먼저 미팅을 시작해 주세요.'); return Promise.resolve(false); }
    return navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      var track = stream.getAudioTracks()[0];
      if (!track) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        toast('공유한 화면에 오디오가 없습니다. "탭 오디오 공유"를 켜고 다시 시도해 주세요.');
        return false;
      }
      var audioOnly = new MediaStream([track]);
      var src = rt.audio.ctx.createMediaStreamSource(audioOnly);
      src.connect(rt.audio.gain);
      src.connect(rt.audio.analyser);
      rt.audio.display = audioOnly;
      stream.getVideoTracks().forEach(function (t) { t.stop(); });
      track.onended = function () {
        rt.audio.display = null;
        toast('시스템 오디오 공유가 종료되었습니다.');
      };
      toast('시스템 오디오를 녹음에 더했습니다. (자막은 마이크 기준)');

    }).catch(function (err) {
      if (err && err.name !== 'NotAllowedError' && err.name !== 'AbortError') {

      }

  }

  /* ── 레벨 미터 ────────────────────────────────────────────── */
  function drawLevel() {
    var box = $('#levelBars');
    if (!box || !rt.audio || !rt.audio.analyser) return;
    var bars = box.children;
    var data = new Uint8Array(rt.audio.analyser.fftSize);
    if (!rt.levelData) rt.levelData = data;
    rt.audio.analyser.getByteTimeDomainData(rt.levelData);
    var sum = 0;
    for (var i = 0; i < rt.levelData.length; i++) {
      var v = (rt.levelData[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / rt.levelData.length);
    var level = clamp(rms * 5.5, 0.05, 1);
    for (var b = 0; b < bars.length; b++) {
      var center = (bars.length - 1) / 2;
      var dist = Math.abs(b - center) / (center + 1);
      var h = Math.max(4, Math.round(level * 24 * (1 - dist * 0.55)));
      bars[b].style.height = h + 'px';
    }
    rt.rafId = requestAnimationFrame(drawLevel);
  }

  function startMeter() {
    cancelAnimationFrame(rt.rafId);
    rt.levelData = new Uint8Array(1024);
    drawLevel();
  }

  function elapsedMs() {

  function playDemo() {
    var fast = /[?&]demo=fast/.test(location.search);
    var lines = demoLines();
    var i = 0;
    var cancelled = false;
    rt.demoAbort = function () { cancelled = true; };
    function next() {
      if (cancelled || !rt.active) return;
      if (i >= lines.length) {
        if (fast) return; // 테스트용 빠른 데모는 사용자가 종료
        setTimeout(function () { if (rt.active && rt.demo) endMeeting({ confirm: false }); }, 1600);
        return;
      }
      var line = lines[i++];
      setSpeaker(line.spk);
      addUtterance(line.src, line.spk, { dst: line.dst, lang: line.lang, demo: true });
      setTimeout(next, fast ? 220 : 1700);
    }
    setTimeout(next, fast ? 250 : 900);
  }

  function togglePause() {
    if (!rt.active) return;
    if (!rt.paused) {
      rt.paused = true;

      pauseRecording();
      var t = $('#timerVal');
      if (t) t.classList.add('paused');
      renderMain();
    } else {
      rt.pausedMs += Date.now() - (rt.pauseMark || Date.now());
      rt.pauseMark = 0;
      rt.paused = false;
      resumeRecording();
      if (!rt.demo) startRecognition();
      renderMain();

  function endMeeting(opts) {
    opts = opts || {};
    if (!rt.active) return;
    if (opts.confirm !== false) {
      openSheet('미팅을 종료할까요?', '<p class="small muted">종료하면 자동으로 요약을 만들고, 녹음 파일과 자막 기록을 저장합니다.</p>' +
        '<div class="row" style="margin-top:14px"><button class="btn grow" data-act="close-sheet">계속하기</button>' +
        '<button class="btn stop grow" data-act="end-confirm">종료하고 요약</button></div>');
      return;
    }
    closeSheet();
    if (typeof rt.demoAbort === 'function') { rt.demoAbort(); rt.demoAbort = null; }
    stopRecognition();
    rt.wantMic = false;
    clearInterval(rt.timerId);
    cancelAnimationFrame(rt.rafId);
    var durationMs = elapsedMs();
    var meeting = {

        decisions: Array.isArray(data.decisions) ? data.decisions.slice(0, 6) : [],
        actions: Array.isArray(data.actions) ? data.actions.slice(0, 8) : [],
        expressions: Array.isArray(data.expressions) ? data.expressions.slice(0, 10) : [],
        stats: statsOf(meeting)
      };
      meeting.summaryState = 'done';
      return meeting.summary;
    }).catch(function (err) {
      meeting.summary = ruleSummary(meeting);
      meeting.summaryState = 'done';
      meeting.summaryError = (err && err.message) ? err.message : 'GPT 요약 실패';
      meeting.summaryMode = 'rule';
      return meeting.summary;
    });
  }

  function statsOf(meeting) {
    var en = meeting.entries.filter(function (e) { return e.lang === 'en'; }).length;
    return {
      total: meeting.entries.length,
      en: en,
      ko: meeting.entries.length - en,
      starred: meeting.entries.filter(function (e) { return e.star; }).length
    };
  }

  function resummarize(meeting, mode) {
    if (!meeting) return;
    if (mode === 'gpt' && !settings.openaiKey) { toast('설정에서 OpenAI API 키를 먼저 저장해 주세요.'); return; }
    var prev = meeting.summary;
    meeting.summaryState = 'working';
    var saved = settings.summaryMode;
    settings.summaryMode = mode;
    renderMain();
    buildSummary(meeting).then(function () {
      settings.summaryMode = saved;
      saveMeetings();
      renderMain();
      if (meeting.summary && meeting.summary.mode === 'gpt') toast('GPT 요약으로 갱신했습니다.');
      else if (mode === 'gpt') toast('GPT 요약에 실패해 규칙 요약으로 대체했습니다.');
      else toast('규칙 기반 요약으로 갱신했습니다.');
      if (!prev) return;
    });
  }

  /* ═══════════════════════════════════════════════════════════
     스터디
     ═══════════════════════════════════════════════════════════ */
  function addStudy(item) {
    if (!item || !item.en) return null;
    var key = normKey(item.en);
    var existing = study.filter(function (s) { return normKey(s.en) === key; })[0];
    if (existing) return existing;
    var entry = {
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      en: String(item.en).trim(),
      ko: String(item.ko || '').trim(),
      nuance: String(item.nuance || '').trim(),
      alt: String(item.alt || '').trim(),
      source: item.source || '',
      meetingId: item.meetingId || '',
      date: item.date || nowISO(),
      learned: false,
      addedAt: nowISO()
    };
    study.unshift(entry);
    saveStudy();
    return entry;
  }

  function toggleStar(entry) {
    entry.star = !entry.star;
    if (entry.star) {
      var en = entry.lang === 'en' ? entry.src : entry.dst;
      var ko = entry.lang === 'en' ? entry.dst : entry.src;
      var item = addStudy({
        en: en, ko: ko,
        nuance: entry.lang === 'en' ? '회의 자막에서 저장한 표현' : '내가 한 말의 영어 번역 — 같은 상황에서 바로 쓸 수 있는 표현',
        source: rt.title, meetingId: rt.meetingId, date: new Date().toISOString()
      });
      entry.studyId = item ? item.id : '';
      toast('스터디에 저장했습니다. 나중에 복습 탭에서 들어 보세요.');
    } else {
      if (entry.studyId) {
        study = study.filter(function (s) { return s.id !== entry.studyId; });
        saveStudy();
      }
      toast('스터디 저장을 해제했습니다.');
    }
    var el = document.getElementById('cap-' + entry.i);
    if (el) {
      el.classList.toggle('star', entry.star);
      var btn = el.querySelector('[data-act="star"]');
      if (btn) {
        btn.classList.toggle('star-on', entry.star);
        btn.setAttribute('aria-pressed', entry.star ? 'true' : 'false');
      }
    }
    saveDraft();
  }

  function studyStats() {
    var learned = study.filter(function (s) { return s.learned; }).length;
    return { total: study.length, learned: learned, left: study.length - learned };
  }

  function filteredStudy() {
    var q = ui.studyQuery.trim().toLowerCase();
    var f = ui.studyFilter;
    return study.filter(function (s) {
      if (f === 'learned' && !s.learned) return false;
      if (f === 'todo' && s.learned) return false;
      if (!q) return true;
      return (s.en + ' ' + s.ko + ' ' + s.nuance + ' ' + s.alt + ' ' + s.source).toLowerCase().indexOf(q) >= 0;
    });
  }

  function navigate(tab) {
    if (rt.active && tab !== 'live') {
      // 미팅 중에는 탭 이동을 막고 안내 (자막을 잃지 않도록)
      toast('미팅 중에는 자막 화면을 유지합니다. 종료 후 이동할 수 있어요.');
      return;
    }
    ui.tab = tab;
    if (tab !== 'summary') { ui.meetingId = null; ui.audioLoaded = null; }
    renderMain();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  }

  function renderMain() {
    if (rt.active && ui.tab !== 'live') ui.tab = 'live';
    var main = $('#main');
    if (!main) return;
    $$('.tabbar button').forEach(function (b) {
      var on = b.getAttribute('data-tab') === ui.tab;
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    var pill = $('#enginePill');
    if (pill) {
      var gpt = settings.engine === 'openai' && settings.openaiKey;
      pill.textContent = gpt ? 'GPT 번역' : '구글 번역';
      pill.className = 'top-pill' + (gpt ? ' is-gpt' : '');
    }
    if (ui.tab === 'live') main.innerHTML = liveHTML();
    else if (ui.tab === 'summary') main.innerHTML = ui.meetingId ? summaryDetailHTML(ui.meetingId) : summaryListHTML();
    else main.innerHTML = studyHTML();

    if (ui.tab === 'live' && rt.active) {
      // 세션 셸이 그려진 뒤 상태 반영
      if (rt.paused) {
        var t = $('#timerVal');
        if (t) t.classList.add('paused');
      }
      startTimer();
      startMeter();
      renderInterim();
      if (rt.autoscroll) scrollCaptions();
      updateRecUI();
    }
    if (ui.tab === 'live' && !rt.active) {
      ui.recovery = ui.recovery || loadDraft();
    }
    if (ui.tab === 'summary' && ui.meetingId) {
      var cur = meetings.filter(function (x) { return x.id === ui.meetingId; })[0];
      if (cur) loadAudioForDetail(cur);
    }

  function ensureAudioEl() {
    if (audioEl) return audioEl;
    audioEl = document.createElement('audio');
    audioEl.preload = 'metadata';
    audioEl.id = 'audioEl';
    audioEl.className = 'sr-only';
    document.body.appendChild(audioEl);
    ['timeupdate', 'loadedmetadata', 'play', 'pause', 'ended', 'durationchange'].forEach(function (ev) {
      audioEl.addEventListener(ev, syncPlayerUI);
    });
    audioEl.addEventListener('error', function () {
      if (ui.player.id) { ui.player.error = true; syncPlayerUI(); }
    });
    return audioEl;
  }

  function playerHTML(m, rec) {
    var size = rec ? (rec.size || rec.blob.size) : (m.audio && m.audio.size) || 0;
    var dur = rec ? rec.durationMs : (m.audio && m.audio.durationMs) || 0;
    var meta = [fmtBytes(size), fmtDur(dur || 0)].filter(Boolean).join(' · ');
    return '<div class="player" id="audioPlayerBox">' +
      '<button class="pbtn" data-act="audio-toggle" id="audioToggle" aria-label="재생">' + I.play + '</button>' +
      '<div class="pbar"><i id="audioFill"></i><input type="range" id="audioSeek" min="0" max="1000" value="0" aria-label="재생 위치"></div>' +
      '<span class="ptime" id="audioTime">0:00 / ' + fmtClock(dur || 0) + '</span>' +
      '</div>' +
      '<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">' +
        '<span class="tiny dim">' + meta + ((rec && rec.demo) || (m.audio && m.audio.demo) ? ' · 데모 오디오' : '') + '</span>' +
        '<span style="flex:1"></span>' +
        '<button class="btn sm ghost" data-act="download-audio" data-id="' + m.id + '">' + I.download + ' 다운로드</button>' +
      '</div>';
  }

  function syncPlayerUI() {
    var box = document.getElementById('audioPlayerBox');
    if (!box) return;
    var toggle = document.getElementById('audioToggle');
    var fill = document.getElementById('audioFill');
    var time = document.getElementById('audioTime');
    var seek = document.getElementById('audioSeek');
    if (ui.player.error) {
      box.innerHTML = '<span class="tiny" style="color:#FCA5A5">녹음을 재생하지 못했습니다. 다운로드해서 확인해 보세요.</span>';
      return;
    }
    if (!audioEl) return;
    var dur = (isFinite(audioEl.duration) && audioEl.duration > 0) ? audioEl.duration : ((ui.player.durationMs || 0) / 1000);
    var cur = audioEl.currentTime || 0;
    if (toggle) toggle.innerHTML = audioEl.paused ? I.play : I.pause;
    if (toggle) toggle.setAttribute('aria-label', audioEl.paused ? '재생' : '일시정지');
    if (fill) fill.style.width = (dur ? (cur / dur) * 100 : 0) + '%';
    if (time) time.textContent = fmtClock(cur * 1000) + ' / ' + fmtClock(dur * 1000);
    if (seek && dur) seek.value = String(Math.round((cur / dur) * 1000));
  }

  function loadAudioForDetail(m) {
    var area = $('#audioArea');
    if (!area) return;
    if (m.audioError) { area.innerHTML = '<div class="tiny dim">녹음을 저장하지 못했습니다.</div>'; return; }
    if (!m.audio && ui.player.id !== m.id) {
      area.innerHTML = '<div class="tiny dim">이 미팅은 녹음이 없습니다.' + (m.demo ? ' (데모 미팅은 짧은 시험용 오디오만 저장됩니다)' : '') + '</div>';
      return;
    }
    ensureAudioEl();
    if (ui.player.id === m.id && audioEl.getAttribute('src')) {
      if (!ui.player.durationMs) ui.player.durationMs = (m.audio && m.audio.durationMs) || m.durationMs || 0;
      area.innerHTML = playerHTML(m, null);
      syncPlayerUI();
      return;
    }
    audioEl.pause();
    audioEl.removeAttribute('src');
    try { audioEl.load(); } catch (e) {}
    ui.player.id = m.id;
    ui.player.error = false;
    area.innerHTML = '<div class="tiny dim">녹음을 불러오는 중…</div>';
    audioGet(m.id).then(function (rec) {
      if (ui.player.id !== m.id) return;
      if (!rec || !rec.blob) { area.innerHTML = '<div class="tiny dim">저장된 녹음 파일을 찾을 수 없습니다.</div>'; return; }
      if (ui.player.url) { try { URL.revokeObjectURL(ui.player.url); } catch (e) {} }
      ui.player.url = URL.createObjectURL(rec.blob);
      ui.player.durationMs = rec.durationMs || (m.audio && m.audio.durationMs) || m.durationMs || 0;
      audioEl.src = ui.player.url;
      area.innerHTML = playerHTML(m, rec);
      syncPlayerUI();
    }).catch(function () {
      area.innerHTML = '<div class="tiny dim">녹음을 불러오지 못했습니다.</div>';
    });
  }

  /* ── 복습 카드 ────────────────────────────────────────────── */
  var rv = { deck: [], idx: 0, flipped: false, good: 0, again: 0, open: false, front: 'en', heard: '', score: null, listening: false };
  var rvRec = null;

  function startReview() {
    var pool = filteredStudy().filter(function (s) { return !s.learned; });
    if (!pool.length) pool = filteredStudy();
    if (!pool.length) { toast('복습할 표현이 없습니다.'); return; }
    rv = {
      deck: pool.slice().sort(function () { return Math.random() - 0.5; }),
      idx: 0, flipped: false, good: 0, again: 0, open: true, front: 'en', heard: '', score: null, listening: false
    };
    renderReview();
  }

  function renderReview() {
    var root = document.getElementById('reviewRoot');
    if (!root) {
      root = document.createElement('div');
      root.id = 'reviewRoot';
      document.body.appendChild(root);
    }
    if (!rv.open) { root.innerHTML = ''; return; }
    var card = rv.deck[rv.idx];
    if (!card) {
      root.innerHTML = '<div class="review-wrap"><div class="review-head"><span class="rt">복습 완료</span><span style="flex:1"></span>' +
        '<button class="btn sm ghost" data-act="rv-close">닫기</button></div>' +
        '<div class="flash" style="text-align:center"><div class="f-tag">SESSION COMPLETE</div>' +
        '<div class="f-en">' + rv.deck.length + '개 표현 완료</div>' +
        '<div class="f-ko">알겠어요 ' + rv.good + ' · 다시 ' + rv.again + '</div>' +
        '<div class="f-nu">틀린 카드는 "다시"로 남겨 두었습니다. 스터디 목록에서 언제든 복습할 수 있어요.</div></div>' +
        '<div class="review-btns"><button class="btn ghost" data-act="rv-restart">한 번 더</button><button class="btn primary" data-act="rv-close">끝내기</button></div></div>';
      return;
    }
    var pct = Math.round((rv.idx / rv.deck.length) * 100);
    var showBack = rv.flipped;
    root.innerHTML = '<div class="review-wrap">' +
      '<div class="review-head"><span class="rt">' + esc(truncate(card.source || '내 표현', 22)) + '</span><span style="flex:1"></span>' +
        '<span class="tiny dim">' + (rv.idx + 1) + ' / ' + rv.deck.length + '</span>' +
        '<button class="btn sm ghost" data-act="rv-close">' + I.close + '</button></div>' +
      '<div class="review-progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="flash" data-act="rv-flip" id="flashCard" role="button" tabindex="0" aria-label="카드 뒤집기">' +
        '<div class="f-tag">' + (showBack ? 'KOREAN' : 'BUSINESS ENGLISH') + '</div>' +
        (showBack
          ? '<div class="f-en" style="font-size:19px">' + esc(card.ko || '—') + '</div>' +
            (card.nuance ? '<div class="f-nu">' + esc(card.nuance) + '</div>' : '') +
            (card.alt ? '<div class="f-nu"><b style="color:#34D399">대체 표현</b> ' + esc(card.alt) + '</div>' : '')
          : '<div class="f-en">' + esc(card.en) + '</div>' +
            '<div class="f-hint">탭해서 뜻 보기</div>') +
      '</div>' +
      '<div class="review-btns">' +
        '<button class="btn ghost" data-act="rv-again">다시 <span class="kbd">←</span></button>' +
        '<button class="btn primary" data-act="rv-good">알겠어요 <span class="kbd">→</span></button>' +
      '</div>' +
      '<div class="review-foot">' +
        '<div class="row" style="gap:6px;flex-wrap:wrap">' +
          '<button class="btn sm ghost" data-act="rv-tts" data-rate="1">' + I.speaker + ' 1.0x</button>' +
          '<button class="btn sm ghost" data-act="rv-tts" data-rate="0.8">' + I.speaker + ' 0.8x</button>' +

        '</div>' +
        '<span class="tiny dim">Space = 뒤집기 · Esc = 닫기</span></div>' +
      '<div class="tiny dim center" id="rvSpeakResult" style="max-width:560px;margin:8px auto 0;min-height:16px">' + (rv.heard ? '들은 문장: ' + esc(rv.heard) + (rv.score != null ? ' · 일치율 ' + rv.score + '%' : '') : '') + '</div>' +
      '</div>';
  }

  function wordSet(str) {
    return String(str || '').toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  }

  function reviewSpeakCheck() {
    var card = rv.deck[rv.idx];
    if (!card) return;
    var out = document.getElementById('rvSpeakResult');
    if (!SR) {
      if (out) out.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome·Edge에서 사용해 주세요.';
      return;
    }
    if (rv.listening) { try { if (rvRec) rvRec.stop(); } catch (e) {} return; }
    rv.listening = true;
    rv.heard = '';
    rv.score = null;
    var heard = '';
    if (out) out.textContent = '듣고 있습니다… 영어 문장을 말해 보세요.';
    try {
      var rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      rec.onresult = function (e) {
        var t = '';
        for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
        heard = t.trim();
        if (out) out.textContent = '들은 문장: ' + heard;
      };
      rec.onerror = function (e) {
        if (out) out.textContent = (e.error === 'not-allowed')
          ? '마이크 권한이 필요합니다.'
          : (e.error === 'no-speech' ? '잘 들리지 않았습니다. 다시 시도해 보세요.' : '음성 인식 오류: ' + e.error);
        rv.listening = false;
        rvRec = null;
      };
      rec.onend = function () {
        rv.listening = false;
        rvRec = null;
        if (!heard) return;
        var target = wordSet(card.en);
        var said = wordSet(heard);
        var hit = target.filter(function (w) { return said.indexOf(w) >= 0; }).length;
        var score = Math.round((hit / Math.max(1, target.length)) * 100);
        rv.heard = heard;
        rv.score = score;
        var s = study.filter(function (x) { return x.id === card.id; })[0];
        if (s && score >= 70 && !s.learned) { s.learned = true; saveStudy(); }
        if (out) out.textContent = '들은 문장: ' + heard + ' · 일치율 ' + score + '% ' + (score >= 70 ? '· 좋아요!' : '· 다시 한 번 들어 보세요.');
        if (ui.tab === 'study') renderMain();
      };
      rvRec = rec;
      rec.start();
      setTimeout(function () { try { rec.stop(); } catch (e) {} }, 9000);
    } catch (e) {
      rv.listening = false;
      if (out) out.textContent = '음성 인식을 시작하지 못했습니다.';
    }
  }

  function reviewNext(good) {
    var card = rv.deck[rv.idx];
    if (!card) return;
    if (good) {
      rv.good++;
      var s = study.filter(function (x) { return x.id === card.id; })[0];
      if (s) { s.learned = true; saveStudy(); }
    } else {
      rv.again++;
    }
    rv.idx++;
    rv.flipped = false;
    renderReview();
    if (ui.tab === 'study') renderMain();
  }

  function closeReview() {
    rv.open = false;
    var root = document.getElementById('reviewRoot');
    if (root) root.innerHTML = '';
    if (ui.tab === 'study') renderMain();
  }

  function exportBackup() {
    var data = backupObject();
    var name = 'meeting-mate-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), name);
    toast('백업 파일을 내려받았습니다 (녹음·키 제외)');
  }

  function importBackup(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); } catch (e) { toast('JSON 파일을 읽지 못했습니다.'); return; }
      if (!data || data.app !== 'meeting-mate') { toast('미팅메이트 백업 파일이 아닙니다.'); return; }
      var addedMeetings = 0, addedStudy = 0;
      (data.meetings || []).forEach(function (m) {
        if (!m || !m.id) return;
        if (!meetings.some(function (x) { return x.id === m.id; })) { meetings.push(m); addedMeetings++; }
      });
      (data.study || []).forEach(function (s) {
        if (!s || !s.en) return;
        if (!study.some(function (x) { return normKey(x.en) === normKey(s.en); })) {
          if (!s.id) s.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          study.push(s); addedStudy++;
        }
      });
      meetings.sort(function (a, b) { return new Date(b.startedAt) - new Date(a.startedAt); });
      saveMeetings(); saveStudy();
      closeSheet();
      renderMain();
      toast('가져오기 완료 · 미팅 ' + addedMeetings + '개, 표현 ' + addedStudy + '개');
      if (done) done();
    };
    reader.onerror = function () { toast('파일을 읽지 못했습니다.'); };
    reader.readAsText(file);
  }

  function findMeeting(id) { return meetings.filter(function (m) { return m.id === id; })[0]; }

  function onAction(act, el) {
    var id = el.getAttribute('data-id');
    switch (act) {
      case 'tab': navigate(el.getAttribute('data-tab')); break;
      case 'settings': settingsSheet(); break;
      case 'start': startMeeting({}); break;
      case 'demo': startMeeting({ demo: true }); break;
      case 'pause': togglePause(); break;
      case 'end': endMeeting({ confirm: true }); break;
      case 'end-confirm': endMeeting({ confirm: false }); break;
      case 'spk': setSpeaker(el.getAttribute('data-spk')); break;
      case 'swap': setSpeaker(rt.speaker === 'other' ? 'me' : 'other'); break;
      case 'toggle-rec':
        if (rt.rec.recorder) {
          stopRecording().then(function (a) {
            if (a) { rt.lastClip = a; toast('녹음을 중지했습니다. (' + fmtBytes(a.blob.size) + ')'); }
            updateRecUI();
          });
        } else if (rt.audio && rt.audio.dest) {
          if (startRecording()) toast('녹음을 시작했습니다.');
        } else {
          toast('녹음을 시작할 수 없습니다. 마이크 권한을 확인해 주세요.');
        }
        break;
      case 'sysaudio': addSystemAudio(); break;
      case 'online-guide': onlineGuide(); break;
      case 'star': {
        var e = rt.entries[Number(el.getAttribute('data-i'))];
        if (e) toggleStar(e);
        break;
      }
      case 'speak-entry': {
        var en = rt.entries[Number(el.getAttribute('data-i'))];
        if (en) speak(en.src, en.lang, 1);
        break;
      }
      case 'retry': {
        var re = rt.entries[Number(el.getAttribute('data-i'))];
        if (re) { re.failed = false; requestTranslation(re); re.pending = true; updateCaption(re); rt.transError = ''; updateLiveBanner(); }
        break;
      }
      case 'clear-trans-error': rt.transError = ''; updateLiveBanner(); break;
      case 'recover': recoverDraft('save'); break;
      case 'discard-draft': recoverDraft('discard'); break;
      case 'open-meeting':
        ui.tab = 'summary'; ui.meetingId = id; ui.audioLoaded = null; renderMain();
        try { window.scrollTo({ top: 0 }); } catch (err) {}
        break;
      case 'back-summary':
        if (audioEl) audioEl.pause();
        ui.meetingId = null; ui.audioLoaded = null; renderMain(); break;
      case 'rename': { var m1 = findMeeting(id); if (m1) renameSheet(m1); break; }
      case 'save-title': {
        var m2 = findMeeting(id);
        var inp = $('#renameInput');
        if (m2 && inp && inp.value.trim()) { m2.title = inp.value.trim().slice(0, 80); saveMeetings(); closeSheet(); renderMain(); }
        break;
      }
      case 'toggle-action': {
        var m3 = findMeeting(id);
        var ai = Number(el.getAttribute('data-idx'));
        if (m3 && m3.summary && m3.summary.actions[ai]) {
          var act = m3.summary.actions[ai];
          act.done = !act.done;
          saveMeetings();
          el.classList.toggle('on', act.done);
          el.setAttribute('aria-checked', act.done ? 'true' : 'false');
          var titleEl = el.parentElement && el.parentElement.querySelector('.action-body b');
          if (titleEl) {
            titleEl.style.opacity = act.done ? '.55' : '';
            titleEl.style.textDecoration = act.done ? 'line-through' : '';
          }
        }
        break;
      }
      case 'add-expr': {
        var m4 = findMeeting(id);
        var xi = Number(el.getAttribute('data-idx'));
        if (m4 && m4.summary && m4.summary.expressions[xi]) {
          var x = m4.summary.expressions[xi];
          addStudy({ en: x.en, ko: x.ko, nuance: x.nuance, alt: x.alt, source: m4.title, meetingId: m4.id, date: m4.startedAt });
          toast('스터디에 추가했습니다.');
          renderMain();
        }
        break;
      }
      case 'add-all-expr': {
        var m5 = findMeeting(id);
        if (m5 && m5.summary) {
          var n = 0;
          (m5.summary.expressions || []).forEach(function (x) {
            var before = study.length;
            addStudy({ en: x.en, ko: x.ko, nuance: x.nuance, alt: x.alt, source: m5.title, meetingId: m5.id, date: m5.startedAt });
            if (study.length > before) n++;
          });
          toast(n ? n + '개 표현을 스터디에 추가했습니다.' : '이미 모두 저장되어 있습니다.');
          renderMain();
        }
        break;
      }
      case 'copy-transcript': {
        var m6 = findMeeting(id);
        if (!m6) break;
        var txt = m6.entries.map(function (x) {
          return '[' + fmtClock(x.t) + '] ' + (x.spk === 'me' ? '나' : '상대') + ' (' + LANG_TAG[x.lang] + ') ' + x.src + '\n   → ' + (x.dst || '');
        }).join('\n');
        copyText(txt, '전체 자막을 복사했습니다.');
        break;
      }
      case 'copy-prompt': {
        var m7 = findMeeting(id);
        if (m7) copyText(summaryPrompt(m7), '요약 프롬프트를 복사했습니다. ChatGPT·피클에 붙여넣어 보세요.');
        break;
      }
      case 'resummarize': {
        var m8 = findMeeting(id);
        if (m8) {
          openSheet('다시 요약', '<p class="small muted">요약 방식을 선택하세요.</p>' +
            '<button class="btn wide" style="margin-top:12px" data-act="do-resummarize" data-id="' + id + '" data-mode="rule">규칙 기반 요약 (무료 · 즉시)</button>' +
            '<button class="btn wide primary" style="margin-top:8px" data-act="do-resummarize" data-id="' + id + '" data-mode="gpt"' + (settings.openaiKey ? '' : ' disabled') + '>GPT 요약' + (settings.openaiKey ? '' : ' — API 키 필요') + '</button>');
        }
        break;
      }
      case 'do-resummarize': {
        var m9 = findMeeting(id);
        closeSheet();
        if (m9) resummarize(m9, el.getAttribute('data-mode'));
        break;
      }
      case 'delete-meeting': {
        var m10 = findMeeting(id);
        if (!m10) break;
        openSheet('미팅 기록 삭제', '<p class="small muted">"' + esc(m10.title) + '" 기록과 녹음을 삭제합니다. 되돌릴 수 없습니다.</p>' +
          '<div class="row" style="margin-top:14px;gap:8px"><button class="btn ghost grow" data-act="close-sheet">취소</button>' +
          '<button class="btn stop grow" data-act="do-delete-meeting" data-id="' + id + '">삭제</button></div>');
        break;
      }
      case 'do-delete-meeting': {
        meetings = meetings.filter(function (x) { return x.id !== id; });
        saveMeetings();
        audioDel(id);
        closeSheet();
        ui.meetingId = null;
        renderMain();
        toast('미팅 기록을 삭제했습니다.');
        break;
      }
      case 'audio-toggle': {
        if (!audioEl || !ui.player.id) break;
        if (audioEl.paused) {
          audioEl.play().catch(function () { toast('녹음을 재생하지 못했습니다.'); });
        } else audioEl.pause();
        break;
      }
      case 'download-audio': {
        var m11 = findMeeting(id);
        if (!m11) break;
        audioGet(id).then(function (rec) {
          if (!rec || !rec.blob) { toast('녹음 파일이 없습니다.'); return; }
          var ext = (rec.mime || '').indexOf('mp4') >= 0 ? 'm4a' : 'webm';
          var stamp = new Date(m11.startedAt).toISOString().slice(0, 16).replace(/[:T]/g, '-');
          downloadBlob(rec.blob, 'meeting-' + stamp + '.' + ext);
          toast('녹음 파일을 내려받았습니다.');
        });
        break;
      }
      case 'study-add': addManualStudySheet(); break;
      case 'save-manual': {
        var enV = ($('#mEn') || {}).value || '';
        var koV = ($('#mKo') || {}).value || '';
        if (!enV.trim()) { toast('영어 표현을 입력해 주세요.'); return; }
        addStudy({ en: enV, ko: koV, nuance: ($('#mNu') || {}).value || '', source: '직접 추가' });
        closeSheet();
        renderMain();
        toast('표현을 저장했습니다.');
        break;
      }
      case 'study-filter': ui.studyFilter = el.getAttribute('data-f'); renderMain(); break;
      case 'study-learn': {
        var s1 = study.filter(function (x) { return x.id === id; })[0];
        if (s1) { s1.learned = !s1.learned; saveStudy(); renderMain(); }
        break;
      }
      case 'study-del': {
        var s2 = study.filter(function (x) { return x.id === id; })[0];
        if (s2) {
          openSheet('표현 삭제', '<p class="small muted">' + esc(truncate(s2.en, 70)) + '</p>' +
            '<div class="row" style="margin-top:14px;gap:8px"><button class="btn ghost grow" data-act="close-sheet">취소</button>' +
            '<button class="btn stop grow" data-act="do-del-study" data-id="' + id + '">삭제</button></div>');
        }
        break;
      }
      case 'do-del-study':
        study = study.filter(function (x) { return x.id !== id; });
        saveStudy(); closeSheet(); renderMain(); toast('표현을 삭제했습니다.');
        break;
      case 'study-speak': {
        var s3 = study.filter(function (x) { return x.id === id; })[0];
        if (s3) speak(s3.en, 'en', Number(el.getAttribute('data-rate')) || 1);
        break;
      }
      case 'study-review': startReview(); break;
      case 'study-export': exportBackup(); break;
      case 'backup-export': exportBackup(); break;
      case 'set-engine': {
        settings.engine = el.getAttribute('data-v');
        if (settings.engine === 'openai' && !settings.openaiKey) {
          toast('OpenAI 키를 먼저 저장해 주세요. 지금은 구글 번역으로 동작합니다.');
        }
        saveSettings(); renderMain(); settingsSheet();
        break;
      }
      case 'save-key': {
        var kInp = $('#keyInput');
        var v = kInp ? kInp.value.trim() : '';
        if (!v) { toast('API 키를 입력해 주세요.'); return; }
        if (!/^sk-/.test(v)) { toast('OpenAI API 키는 보통 sk-로 시작합니다.'); return; }
        settings.openaiKey = v;
        saveSettings(); settingsSheet(); renderMain();
        toast('API 키를 저장했습니다. GPT 번역·요약을 쓸 수 있어요.');
        break;
      }
      case 'clear-key':
        settings.openaiKey = '';
        if (settings.engine === 'openai') settings.engine = 'google';
        saveSettings(); settingsSheet(); renderMain(); toast('API 키를 삭제했습니다.');
        break;
      case 'toggle-rec-default': settings.recDefault = !settings.recDefault; saveSettings(); settingsSheet(); renderMain(); break;
      case 'toggle-autoscroll': settings.autoScroll = !settings.autoScroll; rt.autoscroll = settings.autoScroll; saveSettings(); settingsSheet(); break;
      case 'translate-test': {
        var box = $('#testResult');
        if (box) box.innerHTML = '<div class="banner info" style="margin-top:8px">' + I.info + '<div class="grow">번역 서버에 확인 중…</div></div>';
        translateText('Could you double-check the lead time and the FOB price?', 'en', 'ko').then(function (t) {
          if (box) box.innerHTML = '<div class="banner ok" style="margin-top:8px">' + I.check + '<div class="grow"><b>정상 동작</b><br>' + esc(t) + '</div></div>';
        }).catch(function (err) {
          if (box) box.innerHTML = '<div class="banner err" style="margin-top:8px">' + I.info + '<div class="grow"><b>번역 실패</b><br>네트워크 또는 번역 서버 응답을 확인해 주세요. 미팅 자막은 실패한 문장을 다시 시도할 수 있습니다.</div></div>';
        });
        break;
      }
      case 'backup-import': {
        var fi = $('#backupImport');
        if (fi) fi.click();
        break;
      }
      case 'refresh-storage': refreshStorage(); break;
      case 'wipe': {
        openSheet('모든 기록 삭제', '<p class="small muted">미팅 기록·표현·녹음 오디오가 모두 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</p>' +
          '<div class="row" style="margin-top:14px;gap:8px"><button class="btn ghost grow" data-act="close-sheet">취소</button>' +
          '<button class="btn stop grow" data-act="do-wipe">전체 삭제</button></div>');
        break;
      }
      case 'do-wipe':
        meetings = []; study = [];
        saveMeetings(); saveStudy();
        db().then(function (d) {
          var tx = d.transaction('audio', 'readwrite');
          tx.objectStore('audio').clear();
        }).catch(function () {});
        try { localStorage.removeItem(K.draft); } catch (e) {}
        closeSheet(); ui.meetingId = null; renderMain();
        toast('모든 기록을 삭제했습니다.');
        break;
      case 'set-summary-mode': break;
      case 'close-sheet': closeSheet(); break;
      case 'sheet-back': if (el === el.parentElement) closeSheet(); break;
      /* review */
      case 'rv-flip': rv.flipped = !rv.flipped; renderReview(); break;
      case 'rv-good': reviewNext(true); break;
      case 'rv-again': reviewNext(false); break;
      case 'rv-tts': { var c = rv.deck[rv.idx]; if (c) speak(c.en, 'en', Number(el.getAttribute('data-rate')) || 1); break; }
      case 'rv-speak': reviewSpeakCheck(); break;
      case 'rv-close': closeReview(); break;
      case 'rv-restart': startReview(); break;
    }
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (!act) return;
    if (act === 'sheet-back') { if (ev.target === el) { closeSheet(); return; } }
    if (el.tagName === 'LABEL' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return;
    if (el.tagName === 'A') return;
    ev.preventDefault();
    onAction(act, el);
  });

  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'audioSeek' && audioEl) {
      var dTotal = (isFinite(audioEl.duration) && audioEl.duration > 0) ? audioEl.duration : (ui.player.durationMs || 0) / 1000;
      if (dTotal) audioEl.currentTime = dTotal * (Number(ev.target.value) / 1000);
      return;
    }
    if (ev.target.id === 'studySearch') {
      ui.studyQuery = ev.target.value;
      var list = $('#studyList');
      if (list) {
        var items = filteredStudy();
        list.innerHTML = items.length ? items.map(studyItemHTML).join('') : '<div class="empty"><b>조건에 맞는 표현이 없습니다</b><p>검색어를 지우거나 필터를 바꿔 보세요.</p></div>';
      }
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'studyImport' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
    if (t.id === 'backupImport' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
    if (t.getAttribute('data-act') === 'set-other-lang') {
      settings.otherLang = t.value;
      if (settings.otherLang === settings.myLang) settings.myLang = settings.otherLang === 'en' ? 'ko' : 'en';
      saveSettings(); renderMain(); settingsSheet();
    }
    if (t.getAttribute('data-act') === 'set-my-lang') {
      settings.myLang = t.value;
      if (settings.otherLang === settings.myLang) settings.otherLang = settings.myLang === 'en' ? 'ko' : 'en';
      saveSettings(); renderMain(); settingsSheet();
    }
    if (t.getAttribute('data-act') === 'set-summary-mode') {
      settings.summaryMode = t.value;
      if (t.value === 'gpt' && !settings.openaiKey) toast('GPT 요약에는 OpenAI 키가 필요합니다.');
      saveSettings();
    }
  });

  document.addEventListener('scroll', function (ev) {
    if (ev.target && ev.target.id === 'captionList' && !suppressScroll) {
      var box = ev.target;
      var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      rt.autoscroll = nearBottom;
    }
  }, true);

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (rv.open) { closeReview(); return; }
      if ($('#sheetRoot') && !$('#sheetRoot').hidden) { closeSheet(); return; }
    }
    if (rv.open) {
      if (ev.key === ' ') { ev.preventDefault(); rv.flipped = !rv.flipped; renderReview(); }
      else if (ev.key === 'ArrowLeft') { ev.preventDefault(); reviewNext(false); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); reviewNext(true); }
      return;
    }
    if (ev.key === 'Tab' && rt.active && !ev.shiftKey && ev.target.tagName !== 'INPUT' && ev.target.tagName !== 'TEXTAREA') {
      ev.preventDefault();
      setSpeaker(rt.speaker === 'other' ? 'me' : 'other');
      toast('발언자: ' + speakerName(rt.speaker) + ' (' + LANG_LABEL[langOf(rt.speaker)] + ')');
    }
  });

  window.addEventListener('online', function () { toast('온라인 상태입니다. 번역이 다시 동작합니다.'); if (rt.active) updateLiveBanner(); });
  window.addEventListener('offline', function () { toast('오프라인입니다. 실시간 번역과 음성 인식이 제한됩니다.'); if (rt.active) updateLiveBanner(); });

  window.addEventListener('beforeunload', function (ev) {
    if (rt.active) {
      saveDraft();
      ev.preventDefault();
      ev.returnValue = '미팅이 진행 중입니다. 페이지를 나가면 자막이 초안으로만 저장됩니다.';
      return ev.returnValue;
    }
  });

  /* ── 해시 라우팅(간단) ────────────────────────────────────── */
  function applyHash() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'summary' || h === 'study' || h === 'live') {
      if (rt.active) return;
      ui.tab = h;
    }
  }
  window.addEventListener('hashchange', function () {
    if (rt.active) return;
    applyHash();
    ui.meetingId = null;
    renderMain();
  });

  /* ── PWA ──────────────────────────────────────────────────── */
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && !/^127\.0\.0\.1$/.test(location.hostname)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* ── 시작 ─────────────────────────────────────────────────── */
  function init() {
    applyHash();
    rt.autoscroll = settings.autoScroll !== false;
    ui.recovery = loadDraft();
    renderMain();
    registerSW();
    loadVoices();
    if (recognitionSupported()) {
      // 일부 브라우저는 첫 호출에서 권한 프롬프트를 띄우므로 미리 만들지 않는다
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  // 테스트/디버그용 최소 노출 (읽기 전용 정보)
  window.MeetingMate = {
    version: VERSION,
    build: BUILD,
    get state() { return { tab: ui.tab, active: rt.active, entries: rt.entries.length, meetings: meetings.length, study: study.length }; },
    demoLines: demoLines,
    _ruleSummary: ruleSummary
  };
})();

</script>
</body>
</html>
